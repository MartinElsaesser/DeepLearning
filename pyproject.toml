[project]
name = "pythonboilerplate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "marimo[lsp]>=0.25.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]


[tool.marimo.language_servers.pylsp]    # https://docs.marimo.io/guides/editor_features/language_server/#pylsp-python-lsp-server
enabled = true               # Enable/disable pylsp
enable_mypy = false          # Type checking with mypy (enabled by default, if installed)
enable_ruff = true           # Linting with ruff (enabled by default, if installed)
enable_flake8 = false        # Linting with flake8
enable_pydocstyle = false    # Check docstring style
enable_pylint = false        # Linting with pylint
enable_pyflakes = false      # Syntax checking with pyflakes

[tool.marimo.language_servers.ty]   # https://docs.marimo.io/guides/editor_features/language_server/#ty
enabled = true


# ruff config: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [ # make ruff work smoother with marimo notebooks
	"B018",		# prevents issues if a variable is defined in one and used in a subsequent cell
	"PLR171"	# return statements are used in marimo notebooks to express prints
]
